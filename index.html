<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>NamasteQR - Restaurant & Hotel Management Portal</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/namasteqr-icon.png" />
    <link rel="apple-touch-icon" href="/namasteqr-icon.png" />
    <meta name="description" content="NamasteQR is a comprehensive restaurant & hotel management portal with WhatsApp OTP verification, Kitchen Display System, digital QR menus, table check-ins, staff RBAC, configurable tax policies, and full Billing & POS register." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <meta property="og:title" content="NamasteQR - Restaurant & Hotel Management Portal" />
    <meta property="og:description" content="NamasteQR is a comprehensive restaurant & hotel management portal with WhatsApp OTP verification, Kitchen Display System, digital QR menus, table check-ins, staff RBAC, configurable tax policies, and full Billing & POS register." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Headless Google Translate element styling & suppression */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      .goog-te-banner,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-ZVi9od-aZ2wEe-OiiCO,
      .VIpgJd-ZVi9od-ORHb-OiiCO,
      .VIpgJd-y6EKec {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
        border: none !important;
      }
      html body,
      body,
      body[style*="top"] {
        top: 0 !important;
        position: static !important;
      }
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
        visibility: hidden !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
      .goog-te-gadget {
        display: none !important;
        height: 0 !important;
        visibility: hidden !important;
      }
      .skiptranslate iframe {
        display: none !important;
      }
      #google_translate_element {
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        z-index: -9999 !important;
      }
    </style>
  </head>
  <body>
    <div id="google_translate_element" style="position:absolute;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;z-index:-9999"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,ne,zh-CN,hi,ko,ja,th,tl,si,ta',
            autoDisplay: false
          }, 'google_translate_element');
        }
      };
    </script>
    <script id="google-translate-script" type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
